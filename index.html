<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>小永報｜著色小工具</title>
<link rel="stylesheet" href="style.css">
<script src="script.js" defer></script>
</head>
<body>
<main class="widget" id="widget">
  <section class="drawing-area" id="drawingArea">
    <div class="stage" id="stage">
      <canvas id="drawingCanvas" aria-label="自由著色畫布"></canvas>
      <img id="lineArt" alt="可著色線稿" draggable="false">
      <div class="loading" id="loading">線稿載入中⋯</div>
    </div>
  </section>
  <section class="controls">
    <div class="palette-heading"><b>選擇顏色</b><span id="toolName"></span></div>
    <div class="palette" id="palette"></div>
    
<div class="actions">

  <!-- 復原 -->
  <button
    class="action-button"
    id="undoButton"
    type="button"
    disabled
    aria-label="復原"
    title="復原"
  >
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M3 7v6h6"/>
      <path d="M3 13a9 9 0 1 1 2.6 6.4"/>
    </svg>
  </button>

  <!-- 橡皮擦 -->
  <button
    class="action-button"
    id="eraserButton"
    type="button"
    aria-pressed="false"
    aria-label="橡皮擦"
    title="橡皮擦"
  >
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="m7 21 10 0"/>
      <path d="m3 14 9-9a2 2 0 0 1 3 0l6 6a2 2 0 0 1 0 3l-7 7H8l-5-5a2 2 0 0 1 0-2Z"/>
      <path d="m8 9 7 7"/>
    </svg>
  </button>

  <!-- 清除 -->
  <button
    class="action-button"
    id="clearButton"
    type="button"
    aria-label="清除"
    title="清除"
  >
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M3 6h18"/>
      <path d="M8 6V4h8v2"/>
      <path d="m19 6-1 14H6L5 6"/>
      <path d="M10 11v5M14 11v5"/>
    </svg>
  </button>

</div>
    <p class="hint" id="hint">選擇顏色，開始畫畫吧！</p>
  </section>
</main>
</body>
</html>
