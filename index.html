<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>小永報｜著色小工具</title>
<link rel="stylesheet" href="style.css">
<script src="script.js" defer></script>
</head>
<body>
<main class="widget" id="widget">
  <section class="drawing-area" id="drawingArea">
    <div class="stage" id="stage">
      <canvas id="drawingCanvas" aria-label="自由著色畫布"></canvas>
      <img id="lineArt" alt="可著色線稿" draggable="false">
      <div class="loading" id="loading">線稿載入中⋯</div>
    </div>
  </section>
  <section class="controls">
    <div class="palette-heading"><b>選擇顏色</b><span id="toolName"></span></div>
    <div class="palette" id="palette"></div>
    <div class="actions">
      <button id="undoButton" type="button" disabled>↶ 復原</button>
      <button id="eraserButton" type="button" aria-pressed="false">⌫ 橡皮擦</button>
      <button id="clearButton" type="button">↻ 清除</button>
    </div>
    <p class="hint" id="hint">選擇顏色，開始畫畫吧！</p>
  </section>
</main>
</body>
</html>
