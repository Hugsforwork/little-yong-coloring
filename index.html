<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f3e8">
  <title>小永報｜著色小工具</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="widget" id="widget">
    <section class="drawing-area" aria-label="著色區域">
      <div class="stage" id="stage">
        <canvas id="drawingCanvas" aria-label="自由著色畫布"></canvas>
        <img id="lineArt" alt="可著色線稿">
        <div class="loading" id="loading">線稿載入中⋯</div>
      </div>
    </section>

    <section class="controls" aria-label="著色工具">
      <div class="palette-heading">
        <span class="palette-title">選擇顏色</span>
        <span class="tool-name" id="toolName"></span>
      </div>
      <div class="palette" id="palette" role="group" aria-label="顏色選擇"></div>

      <div class="actions">
        <button type="button" class="action-button" id="undoButton" aria-label="復原上一筆">
          <span aria-hidden="true">↶</span> 復原
        </button>
        <button type="button" class="action-button" id="eraserButton" aria-pressed="false">
          <span aria-hidden="true">⌫</span> 橡皮擦
        </button>
        <button type="button" class="action-button" id="clearButton">
          <span aria-hidden="true">↻</span> 清除
        </button>
      </div>
      <p class="hint" id="hint">選擇顏色，開始畫畫吧！</p>
    </section>
  </main>
</body>
</html>
